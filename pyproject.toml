[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "app-release"
dynamic = ["version"]
description = "Rebuild, stage, tag and publish an app's release, whatever its language and build system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
app-release = "app_release.cli:run"
nuitka-release = "app_release.cli:renamed"

[tool.setuptools.dynamic]
version = { attr = "app_release.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
